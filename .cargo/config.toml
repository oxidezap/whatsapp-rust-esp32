# One config for every supported board. `cargo build` alone targets the ESP32-S3;
# scripts/build.sh selects a board by overriding the target and the `[env]` block
# below (a process environment variable wins over `[env]` unless `force = true`).

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"

[build]
target = "xtensa-esp32s3-espidf"

[unstable]
build-std = ["std", "panic_abort"]

[env]
# Defaults for the ESP32-S3. The C5 needs ESP-IDF v5.5 (v5.4 predates the chip);
# scripts/build.sh sets MCU=esp32c5 and ESP_IDF_VERSION=v5.5.5 for it.
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.4"
