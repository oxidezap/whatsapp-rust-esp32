[package]
name = "whatsapp-esp32-dashboard-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
bytes = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only the cfg(test) modules imported from firmware use these crates.
[dev-dependencies]
async-lock = "3"
futures = "0.3"
