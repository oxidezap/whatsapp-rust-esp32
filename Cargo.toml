[package]
name = "whatsapp-esp32"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
description = "A full, end-to-end-encrypted WhatsApp client running on an ESP32-S3 microcontroller, built on whatsapp-rust."
repository = "https://github.com/oxidezap/whatsapp-rust-esp32"
keywords = ["whatsapp", "esp32", "embedded", "esp-idf", "iot"]
categories = ["embedded"]
readme = "README.md"

[dependencies]
esp-idf-svc = { version = "0.52", features = ["binstart"] }
esp-idf-hal = "0.46"

log = "0.4"
anyhow = "1"
async-trait = "0.1"
async-channel = "2"
futures = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lightweight async executor for ESP32. `unbounded` backs the run-queue with a
# growable SegQueue (infallible push) instead of a fixed 64-slot ArrayQueue whose
# push().unwrap() would panic/abort the firmware if >64 tasks are runnable at once.
edge-executor = { version = "0.4", features = ["unbounded"] }
enumset = "1"

# WebSocket framing (no TLS features - we use ESP-IDF mbedTLS)
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

# WhatsApp protocol, pulled from the upstream repo (no local checkout needed).
# default-features = false drops tokio/sqlite/moka/simd so the crate builds for ESP32.
# wacore exposes the appstate crate via `pub use wacore_appstate as appstate`, so we
# don't list wacore-appstate directly.
#
# DANGER: `danger-skip-cert-chain-verify` disables Noise server-certificate (XEdDSA)
# verification. Needed to connect to the local mock server (its cert isn't signed by
# WhatsApp's production key). REMOVE this feature before connecting to the real
# WhatsApp gateway. Without it the server cert chain is unverified (MITM risk).
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main", default-features = false, features = ["danger-skip-cert-chain-verify"] }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main", default-features = false }
waproto = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main" }

# Optimize for size even in debug: cuts binary from 9MB to ~3MB,
# massively speeds up linking and flashing
[profile.dev]
opt-level = "z"
debug = false
lto = "fat"
codegen-units = 1
strip = false
# build-std already uses panic_abort; matching the crate lets LTO GC unwind landing
# pads and the dead backtrace/gimli symbolizer (firmware reboots on panic anyway).
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = false
panic = "abort"

[build-dependencies]
embuild = "0.33"
dotenvy = "0.15"

# Pull in espressif/mdns component (moved out of ESP-IDF since v5.0)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2" }

[workspace]
