[package]
name = "whatsapp-esp32"
version = "0.1.0"
edition = "2021"
# Tracks whatsapp-rust 0.7.0's declared MSRV (its workspace pins 1.94 and the
# crates are edition 2024). The Xtensa `esp` toolchain must be at least this new.
rust-version = "1.94"
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
description = "A full, end-to-end-encrypted WhatsApp client running on ESP32-S3 and ESP32-C5 microcontrollers, built on whatsapp-rust."
repository = "https://github.com/oxidezap/whatsapp-rust-esp32"
keywords = ["whatsapp", "esp32", "embedded", "esp-idf", "iot"]
categories = ["embedded"]
readme = "README.md"

[lib]
name = "whatsapp_esp32"
path = "src/lib.rs"

[[bin]]
name = "whatsapp-esp32"
path = "src/main.rs"

[dependencies]
# `critical-section`: edge-executor 0.5 guards its run-queue with embassy-sync's
# CriticalSectionRawMutex, which links against a `critical-section` provider.
# esp-idf-hal's is an ESP-IDF spinlock, correct across both cores and ISRs.
esp-idf-svc = { version = "0.52", features = ["binstart", "critical-section"] }
# `Headers` for the admin server's POST handlers (Content-Length / Content-Type);
# the `Request` type esp-idf-svc re-exports implements it but does not re-export it.
embedded-svc = { version = "0.29", default-features = false, optional = true }

log = "0.4"
# anyhow stays a direct dependency: esp-idf-svc errors are converted with `?`,
# which needs anyhow's `std` feature. whatsapp-rust pulls anyhow with
# default-features = false, so relying on its re-export alone would lose that.
anyhow = "1"
# `futures::executor::block_on` lives behind the `executor` feature, which
# whatsapp-rust does not enable, so this one is also declared directly.
futures = "0.3"
# NVS record names are 15 characters at most; src/storage.rs names each record by
# a truncated SHA-256 of its logical key. Already in the tree through whatsapp-rust.
sha2 = { version = "0.11", default-features = false }

# Lightweight async executor for ESP32. Since 0.5 the run-queue is always a
# growable queue (the old `unbounded` feature is gone), so more than 64 runnable
# tasks at once can no longer panic the firmware on a full fixed-size queue.
edge-executor = "0.5"
enumset = "1"

# WebSocket framing (no TLS features - we use ESP-IDF mbedTLS)
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# WhatsApp protocol. Single dependency: since 0.7.0 the crate re-exports
# everything a consumer needs (`whatsapp_rust::{wacore, waproto, buffa,
# async_trait, async_channel, bytes, serde_json, ...}`), so wacore/waproto are no
# longer listed separately and can never drift to a different version than the
# one whatsapp-rust was built against.
#
# default-features = false drops tokio/sqlite/ureq/simd so the crate builds for ESP32.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "ebc50105d8b1e51771ca13d9f45d958e8740aaf5", default-features = false }

# Optimize for size even in debug: cuts binary from 9MB to ~3MB,
# massively speeds up linking and flashing
[profile.dev]
opt-level = "z"
debug = false
lto = "fat"
codegen-units = 1
strip = false
# build-std already uses panic_abort; matching the crate lets LTO GC unwind landing
# pads and the dead backtrace/gimli symbolizer (firmware reboots on panic anyway).
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = false
panic = "abort"

[lints.rust]
# ldproxy announces itself on stderr ("[ldproxy] Running ldproxy"); rustc's
# `linker_messages` lint would otherwise report that on every link.
linker_messages = "allow"

[features]
# The dashboard only. `mock-server` is deliberately not a default: a consumer
# that forgets `default-features = false` must still get a verified connection.
default = ["admin"]
# The HTTP dashboard and API (`admin` module): status, send, pairing code,
# maintenance. The demo firmware serves it; a library consumer can leave it out.
admin = ["dep:embedded-svc"]
# Everything the demo needs to talk to the local mock server, none of which may
# reach the real gateway: the demo accepts any TLS certificate (the mock mints a
# fresh self-signed one per start), auto-scans its own pairing QR, and
# whatsapp-rust skips Noise server-certificate (XEdDSA) verification, since the
# mock's certificate is not signed by WhatsApp's production key. Off, the
# firmware verifies both layers.
mock-server = ["whatsapp-rust/danger-skip-cert-chain-verify"]
# Run inside Espressif's QEMU instead of on a board: brings the network up over the
# emulated OpenCores Ethernet MAC instead of WiFi, and points the default server URL
# at the QEMU host (10.0.2.2). Build with `scripts/qemu.sh build`, which also layers
# `sdkconfig.qemu` on top of `sdkconfig.defaults`; the feature alone is not enough,
# because `peripherals.mac` only exists once `CONFIG_ETH_USE_OPENETH=y` is set.
qemu = ["mock-server"]

[build-dependencies]
embuild = "0.33"
dotenvy = "0.15"

# Pull in espressif/mdns component (moved out of ESP-IDF since v5.0)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2" }

[patch.crates-io]
# ESP-IDF v5.5.5 (the version the ESP32-C5 build uses) backported an sdmmc_host_t
# field after esp-idf-hal 0.46.2 shipped; this revision adds it behind a version
# cfg, so the v5.4 ESP32-S3 build compiles the same source it did before.
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal", rev = "c2dac82f5243b0b7036c392f8218e6a2b4f7e375" }

[workspace]
